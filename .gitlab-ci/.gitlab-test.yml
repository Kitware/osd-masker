###############################################################################
###############################################################################
# Stage -- Unit Testing
###############################################################################

# Single source of truth for supported Python versions (matrix jobs only;
# the per-version tox:pytest/tox:coverage jobs still enumerate by name).
.python-versions: &python-versions ["3.10", "3.11", "3.12", "3.13", "3.14"]

.test-setup:
  extends: .tox-setup
  stage: test
  tags:
    - autoscaler
  rules:
    - !reference [.shared-setup, rules]
  before_script:
    - !reference [.tox-setup, before_script]

.tox:pytest:
  extends: .test-setup
  tags:
    - $RUNNER_TAG
  parallel:
    matrix:
      - TOX_ENV: pytest
        RUNNER_TAG: single-gpu
        CUDA_VISIBLE_DEVICES: "0"
      - TOX_ENV: doctests
        RUNNER_TAG: small-cpu
  script:
    # Convert PYTHON_VERSION (3.10) to tox factor (py310) and run specific env
    - tox -e "py${PYTHON_VERSION//./}-${TOX_ENV}"
  artifacts:
    when: always
    paths:
     - ".coverage.*"
    reports:
      junit: ".junit.*.xml"
    expire_in: 1 day

tox:pytest:py3.10:
  extends: .tox:pytest
  image: python:3.10
  variables:
    PYTHON_VERSION: "3.10"

tox:pytest:py3.11:
  extends: .tox:pytest
  image: python:3.11
  variables:
    PYTHON_VERSION: "3.11"

tox:pytest:py3.12:
  extends: .tox:pytest
  image: python:3.12
  variables:
    PYTHON_VERSION: "3.12"

tox:pytest:py3.13:
  extends: .tox:pytest
  image: python:3.13
  variables:
    PYTHON_VERSION: "3.13"

tox:pytest:py3.14:
  extends: .tox:pytest
  image: python:3.14
  variables:
    PYTHON_VERSION: "3.14"

# Documentation tests: doctests + doc code blocks. Kept out of the .tox:pytest
# matrix so they never feed the coverage combine/gate (they also run --no-cov).
# They validate that docs/examples stay runnable, not package coverage.
tox:docs:
  extends: .test-setup
  tags:
    - autoscaler
  image: python:$PYTHON_VERSION
  parallel:
    matrix:
      - PYTHON_VERSION: *python-versions
        TOX_ENV: ["doctests"]
  script:
    - tox -e "py${PYTHON_VERSION//./}-${TOX_ENV}"

.tox:coverage:version:
  extends: .test-setup
  tags:
    - small-cpu
  before_script:
    - !reference [.shared-setup, before_script]
    # Install dependencies (coverage is in the tests dependency group)
    - poetry sync --only tests -q
  script:
    # Combine all the coverage reports from the pytest matrix for this
    # Python version into a single database file.
    - poetry run coverage combine ./.coverage.*
    # Rename combined file so the final coverage job can distinguish versions.
    - mv .coverage ".coverage.${PYTHON_VERSION}"
  artifacts:
    when: always
    paths:
      - ".coverage.*"
    expire_in: 1 day

tox:coverage:py3.10:
  extends: .tox:coverage:version
  variables:
    PYTHON_VERSION: "3.10"
  dependencies:
    - tox:pytest:py3.10
  needs:
    - job: tox:pytest:py3.10
      artifacts: true

tox:coverage:py3.11:
  extends: .tox:coverage:version
  variables:
    PYTHON_VERSION: "3.11"
  dependencies:
    - tox:pytest:py3.11
  needs:
    - job: tox:pytest:py3.11
      artifacts: true

tox:coverage:py3.12:
  extends: .tox:coverage:version
  variables:
    PYTHON_VERSION: "3.12"
  dependencies:
    - tox:pytest:py3.12
  needs:
    - job: tox:pytest:py3.12
      artifacts: true

tox:coverage:py3.13:
  extends: .tox:coverage:version
  variables:
    PYTHON_VERSION: "3.13"
  dependencies:
    - tox:pytest:py3.13
  needs:
    - job: tox:pytest:py3.13
      artifacts: true

tox:coverage:py3.14:
  extends: .tox:coverage:version
  variables:
    PYTHON_VERSION: "3.14"
  dependencies:
    - tox:pytest:py3.14
  needs:
    - job: tox:pytest:py3.14
      artifacts: true

tox:coverage:
  extends: .test-setup
  tags:
    - small-cpu
  coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+(?:\.\d+)?%)/'
  dependencies:
    - tox:coverage:py3.10
    - tox:coverage:py3.11
    - tox:coverage:py3.12
    - tox:coverage:py3.13
    - tox:coverage:py3.14
  needs:
    - job: tox:coverage:py3.10
      artifacts: true
    - job: tox:coverage:py3.11
      artifacts: true
    - job: tox:coverage:py3.12
      artifacts: true
    - job: tox:coverage:py3.13
      artifacts: true
    - job: tox:coverage:py3.14
      artifacts: true
  script:
    - tox -e coverage
  artifacts:
    when: always
    paths:
      - ".coverage"
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 day
