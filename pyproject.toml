[build-system]
requires = ["poetry-core>=2.2.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "osd-masker"
version = "0.0.1"
description = "OSDMasker is a PyTorch model for masking text and other on-screen display (OSD) elements which have been burned into a video."
license = "Apache-2.0"
readme = "README.md"
authors = [{name = "Kitware, Inc."}]
requires-python = ">=3.10,<3.15"
classifiers = [
    'Operating System :: Unix',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
]
dependencies = [
    # Keep separate Python ranges so Poetry can select compatible NumPy versions.
    # https://stackoverflow.com/questions/77431252/why-doesnt-poetry-select-the-good-version-of-my-dependency
    # NumPy ranges match SMQTK; NumPy 1 and 2 are supported on
    # Python 3.10–3.12. Numba supplies its own NumPy compatibility bounds.
    "numpy>=1.23.5; python_version < '3.13'", # Matches SMQTK on Python 3.10–3.12
    "numpy>=2.1; python_version >= '3.13' and python_version < '3.14'", # Python 3.13 wheels
    "numpy>=2.3.2; python_version >= '3.14'", # Python 3.14 wheels
    "torch>=2.10.0",  # CVE-2025-3001
    "opencv-python-headless>=4.8.1.78",  # CVE-2023-4863
    "tqdm>=4.66.3",  # GHSA-g7vv-2v7x-gj9p
    "av>=17.1.0,<18.0.0",
]

[tool.poetry]
# Poetry-specific configuration
packages = [{include = "osd_masker", from="src"}]

[dependency-groups]
# Linting
linting = [
    "ruff>=0.15.0,<0.16.0",
    "types-setuptools>=65.6.0.1",
    "sphinx-lint>=1.0.0",
    "types-requests>=2.31.0.10",
    # required for pre-commit hook
    "pre-commit>=2.20",
    "pyright[nodejs]>=1.1.320,<1.1.409",
]

# Docs
docs = [
    "Sphinx>=5.3.0",
    "sphinx-copybutton>=0.5.2,<0.6.0",
    "sphinx-rtd-theme>=1.1.1",
    "sphinx-prompt>=1.5.0",
    "sphinx-click>=5.0.0",
    "sphinx-design>=0.6.1",
    "sphinx-datatables>=0.3.1,<0.4.0",
    "livereload>=2.6.3",
    "myst-nb>=1.1.2,<2.0.0",
]

# Testing
tests = [
    # pytest unittesting
    "pytest>=9.0.3", # CVE-2025-71176
    "pytest-cov>=4.0.0", # reports code coverage
    "pytest-xdist>=3.8.0", # allows -n auto|# to be used to run pytests in parallel
    "pytest-codeblock (>=0.5.10,<0.6.0)", # required for code block testing in docs
]

[tool.pytest.ini_options]
addopts = [
    "-lv",                              # Show local in trace-backs.
    "--tb=long",                        # Trace-back print mode.
    "--cov=./src/osd_masker",           # Cover our package specifically
    "--cov=./tests",                    # Also cover our tests for dead spots
    "--cov-report=term",                # Coverage report to terminal
    "--cov-report=xml:coverage.xml",    # for external tool reporting
]
# NOTE: --doctest-modules removed from addopts. To run doctests, use:
#   pytest --doctest-modules src/osd_masker
# Doctests require optional dependencies to be installed.
testpaths = [
    "tests",
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "IGNORE_EXCEPTION_DETAIL",
]

[tool.pytest-codeblock]
test_nameless_codeblocks = true

[tool.ruff]
# Exclude content as appropriate.
extend-exclude = [
    "__pycache__",
    # Anchored: a bare "scripts" would also swallow tests/scripts, which must stay
    # linted -- the guard scripts are real .py files precisely so ruff checks them.
    "./scripts",
    "docs/_build",
    "docs/_implementations",
    ".tox",
    ".dev",
]

line-length = 120
indent-width = 4

# Assume Python 3.10
target-version = "py310"

extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "F", "E", "W", "C90", "I", "N", "D", "UP",
    "YTT", "ANN", "S",  "BLE", "B", "A", "COM", "C4", "T10", "ISC", "ICN", "PLR0917", "PYI", "PT", "Q",
    "RSE", "RET", "SLF", "SIM", "TID252", "ARG", "FIX", "PD", "FLY", "NPY", "RUF027",
    "RUF100", "PERF", "UP045", "RUF013"
]
preview = true  # needed for RUF027
explicit-preview-rules = true

# From program suggested config
ignore = ["C416"]
external = ["FKA100"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"


[tool.ruff.lint.per-file-ignores]
"**/*tests/*.py" = [
  "S101",  # Allow asserts in tests
  "SLF001",  # Allow private member access for introspection in tests
  "D100", "D101", "D102", "D103", "D104", "D105", "D107",  # Allow missing docstring in test dir
  "PLR0917"  # Allow more than one positional arg in tests
]
"docs/examples/*.ipynb" = [
   "PLR0917"  # Allow more than one positional arg in notebooks
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true  # Allow Any for *args and **kwargs

[tool.ruff.lint.isort]
known-first-party = ["osd_masker"]

[tool.ruff.lint.mccabe]
# Flag errors (`C901`) whenever the complexity level exceeds 5.
max-complexity = 5

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 120

[tool.ruff.lint.pylint]
max-positional-args = 1

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pyright]
pythonVersion = "3.10"
reportMissingImports = "warning"
reportDeprecated = "warning"
typeCheckingMode = "standard"
include = [
    "src/osd_masker",
    "tests",
    "scripts",
    "docs",
    ]
exclude = [
    "**/__pycache__",
    "docs/_build",
    "docs/_implementations",
    ".tox",
    ".dev",
    ]
